name: data
use_case:
  label: Data analysis
  blurb: Query data and produce read-only reports.
  rank: 2
description: "Data analyst. Read-only SQL, reports, and insights — no writes outside artifacts, no shell."
mode: analyst
model:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  id: gpt-4o
  fallback_id: gpt-4o-mini
models:
  roles: { cheap: gpt-4o-mini, balanced: gpt-4o, frontier: gpt-5.6-sol, critic: claude-sonnet-5 }
workflow:
  enabled: true
  playbook: data
  routing:
    table: { recon: cheap, plan: balanced, design: balanced, build: balanced, verify: cheap, review: critic }
system_prompt: ./data.md
working_dir: $CWD
artifact_dir: .harness/data
tools:
  builtin:
    Read: allow
    Write: allow
    Edit: deny
    Bash: deny
    Grep: allow
    Glob: allow
    Skill: allow
    MemoryRead: allow
    MemoryWrite: allow
    MemoryList: allow
    Stats: allow
    Delegate: prompt
  mcp_servers: []
hooks:
  pre_tool: []
  post_tool: []
  on_stop: []
improvement:
  enabled: true
  mine_skills_every_n_sessions: 10
