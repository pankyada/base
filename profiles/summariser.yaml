name: summariser
description: "Synthesis worker. Takes research findings and writes a structured report. Called by the research orchestrator."
model:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  id: gpt-6-luna
models:
  roles: { cheap: gpt-6-luna, balanced: gpt-6-luna, frontier: gpt-6-sol, critic: gpt-6-sol }
system_prompt: ./summariser.md
working_dir: $CWD
artifact_dir: .harness/summariser
tools:
  builtin:
    Read: allow
    Write: allow
    Edit: deny
    Bash: deny
    Grep: allow
    Glob: allow
    Skill: allow
    MemoryRead: allow
    MemoryWrite: deny
    MemoryList: allow
    MemoryDelete: deny
    Stats: allow
    Delegate: deny
    AskUser: deny
    TodoWrite: deny
    TodoRead: deny
    ExecuteCode: deny
  mcp_servers: []
improvement:
  enabled: false
  mine_skills_every_n_sessions: 10
