name: assistant
use_case:
  label: Personal assistant
  blurb: Work with memory, calendar, and read-only tools.
  rank: 3
description: "Personal assistant. Read-only over local files and memory, no code execution or edits — for scheduling, notes, research triage, and day-to-day Q&A."
mode: assistant
model:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  id: gpt-6-luna
models:
  roles: { cheap: gpt-6-luna, balanced: gpt-6-luna, frontier: gpt-6-sol, critic: gpt-6-sol }
workflow:
  enabled: true
  playbook: generic
  routing:
    table: { recon: cheap, plan: balanced, design: balanced, build: balanced, verify: cheap, review: balanced }
system_prompt: ./assistant.md
working_dir: $CWD
artifact_dir: .harness/assistant
tools:
  builtin: {}
  mcp_servers: []
hooks:
  pre_tool: []
  post_tool: []
  on_stop: []
improvement:
  enabled: true
  mine_skills_every_n_sessions: 10
