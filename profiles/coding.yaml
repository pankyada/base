name: coding
use_case:
  label: Coding
  blurb: Write and refactor code, then run tests.
  rank: 1
model:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  id: gpt-5.4-mini-2026-03-17
  fallback_id: gpt-5.4-mini-2026-03-17
models:
  roles:
    cheap: gpt-5.6-luna
    balanced: gpt-5.6-terra
    frontier: gpt-5.6-sol
    critic: claude-sonnet-5
workflow:
  enabled: true
  playbook: coding
  min_intensity: { recon: 1, review: 1 }
  budget:
    max_usd_per_task: 2.00
    max_stage_retries: 2
    max_stage_minutes: 15
  routing:
    policy: static
    explore_rate: 0.12
    shadow_rate: 0.05
    table: { recon: cheap, plan: balanced, design: balanced, build: balanced, verify: cheap, review: critic }
  knowledge:
    graph: true
    generalization_probe: true
system_prompt: ./coding.md
working_dir: $CWD
artifact_dir: .harness/coding
tools:
  builtin:
    Read: allow
    Write: allow
    Edit: allow
    Bash: prompt
    Grep: allow
    Glob: allow
    Skill: allow
    MemoryRead: allow
    MemoryWrite: allow
    MemoryList: allow
    MemoryDelete: allow
    Stats: allow
    Delegate: prompt
    TodoWrite: allow
    TodoRead: allow
    AskUser: allow
    ExecuteCode: allow
  mcp_servers: []
hooks:
  pre_tool: []
  post_tool: []
  on_stop: []
improvement:
  enabled: true
  mine_skills_every_n_sessions: 10
# Optional ambiguous-call classifier. Static danger rules always run first.
safety:
  enabled: true
  timeout_ms: 3000
  cache_ttl_hours: 168
