name: coding
model:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  id: gpt-5.4-mini-2026-03-17
  fallback_id: gpt-5.4-mini-2026-03-17
system_prompt: ./prompts/coding.md
working_dir: $CWD
artifact_dir: .harness/coding
tools:
  builtin:
    Read: allow
    Write: allow
    Edit: allow
    Bash: prompt
    Grep: allow
    Glob: allow
    Skill: allow
    MemoryRead: allow
    MemoryWrite: allow
    MemoryList: allow
    MemoryDelete: allow
    Stats: allow
    Delegate: prompt
    TodoWrite: allow
    TodoRead: allow
    AskUser: allow
    ExecuteCode: allow
  mcp_servers: []
hooks:
  pre_tool: []
  post_tool: []
  on_stop: []
improvement:
  enabled: true
  mine_skills_every_n_sessions: 10
