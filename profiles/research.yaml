name: research
use_case:
  label: Research
  blurb: Coordinate focused research and synthesis workers.
  rank: 5
description: "Research orchestrator. Fans work out to researcher and summariser sub-agents; synthesises findings into a structured report."
model:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  id: gpt-6-luna
models:
  roles: { cheap: gpt-6-luna, balanced: gpt-6-luna, frontier: gpt-6-sol, critic: gpt-6-sol }
workflow:
  enabled: true
  playbook: research
  routing:
    table: { recon: cheap, plan: balanced, design: balanced, build: frontier, verify: cheap, review: critic }
system_prompt: ./research.md
working_dir: $CWD
artifact_dir: .harness/research
tools:
  builtin:
    Read: allow
    Write: deny
    Edit: deny
    Bash: deny
    Grep: allow
    Glob: allow
    Skill: allow
    MemoryRead: allow
    MemoryWrite: allow
    MemoryList: allow
    MemoryDelete: allow
    Stats: allow
    Delegate: allow
    AskUser: allow
    TodoWrite: allow
    TodoRead: allow
    ExecuteCode: deny
  mcp_servers:
    - name: fetch
      transport: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-fetch"]
      acl:
        fetch: allow
        "*": deny
    - name: brave-search
      transport: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-brave-search"]
      env:
        BRAVE_API_KEY: "${BRAVE_API_KEY}"
      acl:
        brave_web_search: allow
        "*": deny
agents:
  - name: researcher
    profile: ./researcher.yaml
    input:
      type: object
      required:
        - query
      properties:
        query:
          type: string
        sources:
          type: array
          items:
            type: string
    output:
      type: object
      required:
        - findings
      properties:
        findings:
          type: array
          items:
            type: object
    spawn:
      label: Researcher
      hint: Find and verify sources for a focused question.
      prompt_field: query
      example:
        query: "What changed in the latest release?"
      max_concurrent: 3
      budget_usd: 0.50
  - name: summariser
    profile: ./summariser.yaml
    input:
      type: object
      required:
        - findings
      properties:
        findings:
          type: array
        format:
          type: string
          enum:
            - markdown
            - html
            - plain
    output:
      type: object
      required:
        - report
      properties:
        report:
          type: string
    spawn:
      label: Summariser
      hint: Turn collected findings into a concise report.
      example:
        findings: []
        format: markdown
      max_concurrent: 1
      budget_usd: 0.50
improvement:
  enabled: true
  mine_skills_every_n_sessions: 10
