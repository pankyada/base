name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Bump version, commit, and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(npm version "${{ inputs.bump }}" -m "chore(release): v%s")
          git push origin main
          git push origin "$NEW_VERSION"
          echo "tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: [bump]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build binaries
        run: pnpm build:bin

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.bump.outputs.tag || github.ref_name }}"
          tar -czf bin/harness-profiles.tar.gz profiles
          gh release create "$TAG" \
            bin/harness-macos-arm64 \
            bin/harness-macos-x64 \
            bin/harness-linux-x64 \
            bin/harness-windows-x64.exe \
            bin/harness-server-macos-arm64 \
            bin/harness-server-macos-x64 \
            bin/harness-server-linux-x64 \
            bin/harness-server-windows-x64.exe \
            bin/harness-tui-darwin-arm64 \
            bin/harness-tui-darwin-amd64 \
            bin/harness-tui-linux-amd64 \
            bin/harness-tui-windows-amd64.exe \
            bin/harness-profiles.tar.gz \
            --title "$TAG" \
            --generate-notes
