name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build binaries
        run: pnpm build:bin

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            bin/harness-macos-arm64 \
            bin/harness-macos-x64 \
            bin/harness-linux-x64 \
            bin/harness-server-macos-arm64 \
            bin/harness-server-macos-x64 \
            bin/harness-server-linux-x64 \
            bin/harness-tui-darwin-arm64 \
            bin/harness-tui-darwin-amd64 \
            bin/harness-tui-linux-amd64 \
            --title "${{ github.ref_name }}" \
            --generate-notes
